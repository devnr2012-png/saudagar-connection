<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaudagarConnection | B2B Wholesaler & Retailer Direct Trade Directory</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Sign-In SDK Script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 800: '#1E293B', 900: '#0F172A', 950: '#030712' },
            gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
            whatsapp: { DEFAULT: '#25D366', hover: '#20BA56' }
          }
        }
      }
    }
  </script>
  <style>
    .modal-backdrop { background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="h-full font-sans text-slate-800 antialiased flex flex-col bg-slate-50">

  <!-- ================= AUTH MODAL ================= -->
  <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl border border-slate-200">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-navy-950 font-extrabold text-2xl mx-auto shadow-lg">
          <i class="fa-solid fa-handshake"></i>
        </div>
        <h2 id="authTitle" class="text-2xl font-extrabold text-navy-900">Welcome to SaudagarConnection</h2>
        <p class="text-xs text-slate-500">Connect Local Wholesalers & Retailers Directly</p>
      </div>

      <!-- Mode Selector -->
      <div class="flex rounded-xl bg-slate-100 p-1 text-xs font-bold">
        <button type="button" id="tabLoginBtn" onclick="switchAuthMode('login')" class="flex-1 py-2.5 rounded-lg bg-white text-navy-900 shadow-sm transition">Login</button>
        <button type="button" id="tabSignupBtn" onclick="switchAuthMode('signup')" class="flex-1 py-2.5 rounded-lg text-slate-600 transition">Sign Up</button>
      </div>

      <!-- Official Google Sign-In Container -->
      <div class="space-y-3">
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleGoogleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin flex justify-center w-full"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-text="continue_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
      </div>

      <div class="relative flex items-center justify-center">
        <div class="border-t border-slate-200 w-full"></div>
        <span class="bg-white px-3 text-[11px] text-slate-400 font-bold uppercase">Or Form</span>
      </div>

      <!-- Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3 text-xs">
        <div id="fieldGroupName" class="hidden">
          <label class="block font-bold text-slate-700 mb-1">Full Name:</label>
          <input type="text" id="inputName" placeholder="Devendra Srivastava" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none">
        </div>

        <div id="fieldGroupMobile">
          <label class="block font-bold text-slate-700 mb-1">Mobile Number:</label>
          <input type="tel" id="inputMobile" placeholder="98110 XXXXX" maxlength="10" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none">
        </div>

        <div id="fieldGroupPassword">
          <label class="block font-bold text-slate-700 mb-1">Password:</label>
          <input type="password" id="inputPassword" placeholder="••••••••" class="w-full p-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none">
        </div>

        <div id="fieldGroupRole" class="hidden">
          <label class="block font-bold text-slate-700 mb-1">I am a:</label>
          <select id="inputRole" class="w-full p-3 rounded-xl border border-slate-300 bg-white font-bold focus:outline-none">
            <option value="RETAILER">Retailer / Shop Owner</option>
            <option value="WHOLESALER">Wholesaler / Stockist</option>
          </select>
        </div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white font-extrabold text-sm shadow-lg transition">
          Login to Account
        </button>
      </form>
    </div>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-navy-900 text-white shadow-md border-b border-navy-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16 sm:h-20">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gold-500 text-navy-950 font-extrabold flex items-center justify-center text-xl">
          <i class="fa-solid fa-handshake"></i>
        </div>
        <span class="text-lg font-extrabold">Saudagar<span class="text-gold-400">Connection</span></span>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-navy-800 border border-navy-700 text-xs">
          <div class="w-7 h-7 rounded-full bg-gold-500 text-navy-950 font-extrabold flex items-center justify-center" id="userInitialAvatar">D</div>
          <span class="font-bold text-white" id="headerUserName">User</span>
        </div>
        <button onclick="handleLogout()" class="px-3 py-2 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30 font-bold text-xs">
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6">
    <h2 class="text-xl font-extrabold text-navy-900">Dashboard Area</h2>
  </main>

  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-navy-900 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl border border-gold-400/40 transform translate-y-20 opacity-0 transition-all">
    <span id="toastMessage" class="font-bold">Notification</span>
  </div>

  <script>
    let currentUser = null;
    let authMode = 'login';

    function switchAuthMode(mode) {
      authMode = mode;
      const tLogin = document.getElementById('tabLoginBtn');
      const tSignup = document.getElementById('tabSignupBtn');
      const fName = document.getElementById('fieldGroupName');
      const fRole = document.getElementById('fieldGroupRole');
      const btn = document.getElementById('authSubmitBtn');

      if (mode === 'signup') {
        tSignup.className = 'flex-1 py-2.5 rounded-lg bg-white text-navy-900 shadow-sm transition';
        tLogin.className = 'flex-1 py-2.5 rounded-lg text-slate-600 transition';
        fName.classList.remove('hidden');
        fRole.classList.remove('hidden');
        btn.innerText = 'Sign Up & Register';
      } else {
        tLogin.className = 'flex-1 py-2.5 rounded-lg bg-white text-navy-900 shadow-sm transition';
        tSignup.className = 'flex-1 py-2.5 rounded-lg text-slate-600 transition';
        fName.classList.add('hidden');
        fRole.classList.add('hidden');
        btn.innerText = 'Login to Account';
      }
    }

    // Google Sign-In Callback Handler
    function handleGoogleCredentialResponse(response) {
      // Decode JWT token from Google to get user details
      const responsePayload = parseJwt(response.credential);
      currentUser = {
        name: responsePayload.name,
        email: responsePayload.email,
        role: 'RETAILER'
      };
      finishLogin();
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('0' + ('-(' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const mobile = document.getElementById('inputMobile').value;
      const name = document.getElementById('inputName').value;
      const role = document.getElementById('inputRole').value;

      if(mobile.length < 10) { alert('Enter valid mobile number'); return; }

      currentUser = {
        name: authMode === 'signup' && name ? name : 'User ' + mobile.slice(-4),
        role: authMode === 'signup' ? role : 'RETAILER'
      };
      finishLogin();
    }

    function finishLogin() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('headerUserName').innerText = currentUser.name;
      document.getElementById('userInitialAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
      showToast(`Welcome, ${currentUser.name}!`);
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('authModal').classList.remove('hidden');
      showToast('Logged out successfully.');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMessage').innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
    }
  </script>
</body>
</html>
